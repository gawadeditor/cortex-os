  <style>
    /* ═══════════════════════════════════════════════════════════════════
       Cortex — design system
       A dark, layered operations console. Warm ember accent (light in an
       underground chamber; a forge on a factory floor). Industrial display
       OS UI type for display, OS mono for data. Self-contained: no web fonts.
       Every legacy class name below is preserved so all templates keep
       working; only the visual language changed.
       ═══════════════════════════════════════════════════════════════════ */

    :root {
      /* ground + layered surfaces */
      --bg:            #0b0d10;
      --bg-2:          #0e1116;
      --surface:       #14171d;
      --raised:        #1b1f27;
      --overlay:       #21262f;

      /* lines */
      --border:        #262b33;
      --border-strong: #363d47;
      --hairline:      rgba(255,255,255,.06);

      /* ink */
      --text:          #eef1f5;
      --muted:         #9aa4b2;
      --faint:         #6b7481;

      /* one accent — ember */
      --accent:        #f0a838;
      --accent-ink:    #1a1206;
      --accent-dim:    #8a6524;
      --accent-bg:     rgba(240,168,56,.10);
      --accent-line:   rgba(240,168,56,.35);

      /* semantic signal system (separate from the accent) */
      --good:          #4ec26f;
      --warn:          #e5a93a;
      --critical:      #f0574a;
      --info:          #58a6ff;
      --good-bg:       rgba(78,194,111,.12);
      --warn-bg:       rgba(229,169,58,.13);
      --critical-bg:   rgba(240,87,74,.12);
      --info-bg:       rgba(88,166,255,.12);

      /* legacy aliases — do not remove (templates reference these) */
      --green:  var(--good);
      --yellow: var(--warn);
      --red:    var(--critical);
      --blue:   var(--info);

      /* spacing ladder — density 7 (UI/UX Pro Max MASTER.md) */
      --space-xs:  4px;
      --space-sm:  8px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --space-2xl: 48px;
      --space-3xl: 64px;

      /* geometry + motion */
      --radius:   9px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --gap:      var(--space-md);
      --pad:      18px;

      /* shadow-depth ladder (MASTER.md) + legacy aliases */
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 4px 10px -2px rgba(0,0,0,.45), 0 2px 4px rgba(0,0,0,.35);
      --shadow-lg: 0 12px 28px -8px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.4);
      --shadow-xl: 0 24px 56px -12px rgba(0,0,0,.72);
      --shadow-1:   var(--shadow-sm);
      --shadow-2:   var(--shadow-md);
      --shadow-pop: var(--shadow-xl);

      --ease:     cubic-bezier(.2,.6,.2,1);
      --dur:      160ms;
      --dur-slow: 320ms;

      /* focus ring — one definition, used by :focus-visible everywhere */
      --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

      /* type — self-contained, no web fonts (offline-first dashboard;
         no-external-CDN tests assert served HTML links nothing remote).
         Display = OS UI face; data + technical labels = OS mono. */
      --font-display: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-body:    ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono:    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

      /* type scale (MASTER.md — 16px base, 1.5 line-height) */
      --h1: 25px; --h2: 19px; --h3: 15px;
      --display-tracking: -.02em;
    }

    /* ═══ Presentation skin — a richer token overlay for client demos.
       Mostly redefines TOKENS so every page inherits it for free; a small,
       explicitly-scoped set of [data-skin="presentation"] rules add the
       glass surfaces, minimal glow and deliberate stagger that make it feel
       premium (UI/UX Pro Max: "minimal glow, low white emission, adaptive
       translucency", "avoid cheap visuals + fast animations").
       Toggled via document.documentElement.dataset.skin. ═══ */
    :root[data-skin="presentation"] {
      --bg:            #090b11;
      --bg-2:          #0c0f16;
      --surface:       rgba(24,28,37,.72);
      --surface-solid: #181c25;
      --raised:        rgba(30,35,46,.78);
      --overlay:       #232a35;
      --border:        rgba(255,255,255,.09);
      --border-strong: rgba(255,255,255,.16);
      --text:          #f4f6f9;
      --muted:         #a4aebd;
      --accent-bg:     rgba(240,168,56,.15);
      --accent-line:   rgba(240,168,56,.5);
      --radius:    13px;
      --radius-sm:  8px;
      --radius-lg: 20px;
      --pad:       22px;
      --gap:       20px;
      --dur:       220ms;
      --dur-slow:  460ms;
      --ease:      cubic-bezier(.16,.84,.28,1);
      --h1: 31px; --h2: 22px; --h3: 16px;
      --display-tracking: -.032em;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
      --shadow-md: 0 8px 24px -6px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
      --shadow-lg: 0 22px 60px -12px rgba(0,0,0,.7), 0 8px 18px rgba(0,0,0,.5);
      --shadow-xl: 0 40px 90px -20px rgba(0,0,0,.78);
      --skin-elevate: linear-gradient(180deg, rgba(255,255,255,.035), transparent 40%), var(--raised);
      --skin-hero: radial-gradient(1100px 520px at 72% -30%, rgba(240,168,56,.17), transparent 62%);
    }

    /* glass surfaces — translucent card over the ambient forge glow, with a
       hairline top highlight (the "lensing" cue). backdrop-filter is a demo-
       only cost; the base skin never pays it. */
    :root[data-skin="presentation"] .card,
    :root[data-skin="presentation"] .kpi-card,
    :root[data-skin="presentation"] .health-card,
    :root[data-skin="presentation"] .score-card,
    :root[data-skin="presentation"] .action-banner,
    :root[data-skin="presentation"] details > summary,
    :root[data-skin="presentation"] .collapse-body,
    :root[data-skin="presentation"] .cb-panel,
    :root[data-skin="presentation"] .t1-card,
    :root[data-skin="presentation"] .kpi-strip .kpi-card {
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 42%),
        var(--surface);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-color: var(--border);
    }
    :root[data-skin="presentation"] .card::after,
    :root[data-skin="presentation"] .kpi-card::after,
    :root[data-skin="presentation"] .t1-card::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; z-index: 1;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22) 25%, rgba(255,255,255,.22) 75%, transparent);
      pointer-events: none;
    }
    :root[data-skin="presentation"] .card:hover,
    :root[data-skin="presentation"] .t1-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    /* minimal glow on the things that matter */
    :root[data-skin="presentation"] h1 { text-shadow: 0 0 28px rgba(240,168,56,.14); }
    :root[data-skin="presentation"] .nav-brand::before,
    :root[data-skin="presentation"] .perf-dot-ok,
    :root[data-skin="presentation"] .wp-dot { box-shadow: 0 0 12px currentColor; }
    :root[data-skin="presentation"] .btn-primary {
      box-shadow: 0 0 0 1px var(--accent-line), 0 10px 30px -8px rgba(240,168,56,.55);
    }
    :root[data-skin="presentation"] .t1-val,
    :root[data-skin="presentation"] .kpi-val { text-shadow: 0 0 26px rgba(240,168,56,.18); }
    :root[data-skin="presentation"] .t1-card::after { opacity: .9; height: 4px; filter: blur(.5px); }
    :root[data-skin="presentation"] .t1-card.is-good::after   { box-shadow: 0 0 16px -2px var(--good); }
    :root[data-skin="presentation"] .t1-card.is-warn::after   { box-shadow: 0 0 16px -2px var(--warn); }
    :root[data-skin="presentation"] .t1-card.is-critical::after { box-shadow: 0 0 16px -2px var(--critical); }
    :root[data-skin="presentation"] .t1-card.is-accent::after { box-shadow: 0 0 16px -2px var(--accent); }
    :root[data-skin="presentation"] .home-hero { border-color: var(--border); box-shadow: var(--shadow-md); }
    :root[data-skin="presentation"] .site-nav {
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      background: linear-gradient(180deg, rgba(9,11,17,.7), transparent);
    }

    /* deliberate load stagger — grid/section children rise in a wave.
       Opt-in via .skin-stagger on a parent; reduced-motion renders final. */
    :root[data-skin="presentation"] .skin-stagger > * {
      animation: skin-rise var(--dur-slow) var(--ease) both;
    }
    :root[data-skin="presentation"] .skin-stagger > *:nth-child(1) { animation-delay: 30ms; }
    :root[data-skin="presentation"] .skin-stagger > *:nth-child(2) { animation-delay: 90ms; }
    :root[data-skin="presentation"] .skin-stagger > *:nth-child(3) { animation-delay: 150ms; }
    :root[data-skin="presentation"] .skin-stagger > *:nth-child(4) { animation-delay: 210ms; }
    :root[data-skin="presentation"] .skin-stagger > *:nth-child(5) { animation-delay: 270ms; }
    :root[data-skin="presentation"] .skin-stagger > *:nth-child(n+6) { animation-delay: 320ms; }
    @keyframes skin-rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 78% -12%, rgba(240,168,56,.06), transparent 60%),
        radial-gradient(900px 500px at -8% 108%, rgba(88,166,255,.05), transparent 55%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px; line-height: 1.55;
      padding: var(--gap);
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum" 0;
    }
    @media (min-width: 768px)  { body { padding: 20px 22px 56px; } }
    @media (min-width: 1024px) { body { padding: 22px 26px 60px; } }
    @media (max-width: 400px)  { body { padding: 12px 12px 48px; } }

    /* subtle one-time entrance for main content */
    body > *:not(nav):not(header):not(button):not(script):not(style):not(.toast) {
      animation: rise var(--dur) var(--ease) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important;
                               scroll-behavior: auto !important; }
    }

    a { color: var(--accent); text-decoration: none; transition: color var(--dur) var(--ease); }
    a:hover { color: #ffc670; text-decoration: none; }

    /* one focus ring for everything keyboard-reachable (MASTER.md a11y) */
    :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
    a:focus-visible, button:focus-visible, summary:focus-visible,
    [tabindex]:focus-visible, .btn:focus-visible { box-shadow: var(--focus-ring); }
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

    h1, h2, h3, .nav-brand { font-family: var(--font-display); letter-spacing: var(--display-tracking); }
    h1 { font-size: var(--h1); }
    h2 { font-size: var(--h2); }
    h3 { font-size: var(--h3); }
    code, pre, .mono, kbd { font-family: var(--font-mono); }
    ::selection { background: var(--accent-line); color: #fff; }

    /* SVG icon system — replaces emoji icons (MASTER.md anti-pattern) */
    .i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;
         flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.75;
         stroke-linecap: round; stroke-linejoin: round; }
    .i-lg { width: 1.25em; height: 1.25em; }
    button, summary, [role="button"], .btn, label[for], .cb-opt, .nav-link,
    .filter-link, .sub-nav-link { cursor: pointer; }

    /* scrollbars */
    * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px;
                                 border: 2px solid transparent; background-clip: content-box; }

    /* ── Top rail: a thin production line across the very top of the page ── */
    body::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 200;
      background: linear-gradient(90deg, transparent, var(--accent-line) 20%, var(--accent) 50%, var(--accent-line) 80%, transparent);
      opacity: .5;
    }
    /* presentation skin: warmer forge glow behind the whole page + brighter rail */
    :root[data-skin="presentation"] body {
      background:
        radial-gradient(1200px 640px at 74% -18%, rgba(240,168,56,.13), transparent 60%),
        radial-gradient(900px 520px at -10% 112%, rgba(88,166,255,.06), transparent 55%),
        var(--bg);
    }
    :root[data-skin="presentation"] body::before { opacity: .8; height: 3px; }

    /* ── Nav ── */
    .site-nav { display: flex; align-items: center; gap: 20px; padding: 12px 2px 16px;
                border-bottom: 1px solid var(--border); margin-bottom: var(--gap); flex-wrap: wrap; }
    .nav-brand { font-weight: 800; font-size: 16px; color: var(--text); text-decoration: none;
                 text-transform: uppercase; letter-spacing: .06em; display: inline-flex; align-items: center; gap: 8px; }
    .nav-brand::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--accent);
                         box-shadow: 0 0 10px var(--accent-line); }
    .nav-links { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; }
    .nav-link  { padding: 5px 11px; border-radius: var(--radius-sm); color: var(--muted);
                 font-size: 13px; font-weight: 500; text-decoration: none; transition: all var(--dur) var(--ease); }
    .nav-link:hover { background: var(--surface); color: var(--text); text-decoration: none; }
    .nav-link.active { background: var(--accent-bg); color: var(--accent); font-weight: 600;
                       box-shadow: inset 0 0 0 1px var(--accent-line); }

    /* worker / factory status pill (injected by _nav.html) */
    .worker-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
                   font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
                   border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted);
                   white-space: nowrap; }
    .worker-pill .wp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
    .worker-pill.is-running { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--border)); }
    .worker-pill.is-running .wp-dot { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); animation: pulse 2s var(--ease) infinite; }
    .worker-pill.is-idle .wp-dot { background: var(--warn); }
    .worker-pill.is-stopped .wp-dot { background: var(--faint); }
    .worker-pill button { all: unset; cursor: pointer; color: var(--muted); font-size: 11px;
                          padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border-strong); }
    .worker-pill button:hover { color: var(--text); border-color: var(--accent-line); }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px var(--good-bg); } 50% { box-shadow: 0 0 0 5px transparent; } }

    /* ── Secondary nav ── */
    .sub-nav { display: flex; gap: 4px; margin-bottom: var(--gap); flex-wrap: wrap;
               padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .sub-nav-link { padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
                    color: var(--muted); text-decoration: none; border: 1px solid transparent;
                    transition: all var(--dur) var(--ease); }
    .sub-nav-link:hover { background: var(--surface); border-color: var(--border);
                          color: var(--text); text-decoration: none; }
    .sub-nav-link.active { background: var(--accent-bg); border-color: var(--accent-line);
                           color: var(--accent); font-weight: 600; }

    /* ── Breadcrumb ── */
    .breadcrumb { display: flex; gap: 6px; align-items: center; font-size: 12px;
                  color: var(--faint); margin-bottom: 10px; flex-wrap: wrap; }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb-sep { color: var(--border-strong); user-select: none; }

    /* ── Page header ── */
    .page-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .page-header h1 { font-size: 25px; font-weight: 700; letter-spacing: -.02em; }
    .page-meta { color: var(--muted); font-size: 12.5px; }

    /* ── Cards — left status stripe reads like a factory-floor label ── */
    .card { position: relative; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: var(--pad); margin-bottom: var(--gap);
            box-shadow: var(--shadow-1); overflow: hidden; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
                    background: var(--border-strong); }
    .card.ok::before, .card.card-ok::before, .card.is-good::before { background: var(--good); }
    .card.warn::before, .card.card-warn::before, .card.is-warn::before { background: var(--warn); }
    .card.err::before, .card.card-err::before, .card.is-critical::before { background: var(--critical); }
    .card.accent::before, .card.is-accent::before { background: var(--accent); }
    .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase;
                  letter-spacing: .09em; color: var(--faint); margin-bottom: 12px; }

    /* ── KPI / stat tiles ── */
    .kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                 gap: 12px; margin-bottom: var(--gap); }
    .kpi-card { background: linear-gradient(180deg, var(--raised), var(--surface));
                border: 1px solid var(--border); border-radius: var(--radius);
                padding: 15px 18px; box-shadow: var(--shadow-1); }
    .kpi-val { font-family: var(--font-display); font-size: 27px; font-weight: 700;
               font-variant-numeric: tabular-nums; line-height: 1.05; letter-spacing: -.02em; }
    .kpi-lbl { font-size: 10.5px; color: var(--faint); text-transform: uppercase;
               letter-spacing: .09em; margin-top: 5px; font-weight: 600; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: var(--font-mono); }

    /* ── Health / platform grid ── */
    .health-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
                   gap: var(--gap); margin-bottom: var(--gap); }
    .health-card { position: relative; background: var(--surface); border: 1px solid var(--border);
                   border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow-1);
                   overflow: hidden; }
    .health-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--border-strong); }
    .health-card-ok::before   { background: var(--good); }
    .health-card-warn::before { background: var(--warn); }
    .health-card-err::before  { background: var(--critical); }
    .health-card-empty { border-style: dashed; opacity: .7; }
    .health-name { font-family: var(--font-display); font-size: 14px; font-weight: 700;
                   text-transform: capitalize; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
    .health-stat { display: flex; justify-content: space-between; align-items: baseline;
                   font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--hairline); }
    .health-stat:last-child { border-bottom: none; }

    /* ── Scoreboard ── */
    .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-bottom: var(--gap); }
    @media (max-width: 560px) { .scoreboard { grid-template-columns: 1fr; } }
    .score-card { position: relative; background: var(--surface); border: 1px solid var(--border);
                  border-radius: var(--radius); padding: 15px 16px; overflow: hidden; box-shadow: var(--shadow-1); }
    .score-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--border-strong); }
    .score-card-best::before  { background: var(--good); }
    .score-card-worst::before { background: var(--critical); }
    .score-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase;
                   letter-spacing: .08em; margin-bottom: 7px; }
    .score-label-best  { color: var(--good); }
    .score-label-worst { color: var(--critical); }
    .score-ep   { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .score-stats { font-size: 12px; color: var(--muted); line-height: 1.7; }

    /* ── Action banner ── */
    .action-banner { background: var(--accent-bg); border: 1px solid var(--accent-line);
                     border-radius: var(--radius); padding: 14px 18px; margin-bottom: var(--gap);
                     display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .action-banner-body { flex: 1; min-width: 0; }
    .action-banner-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--accent); }
    .action-banner-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .action-banner-count { background: var(--accent); color: var(--accent-ink); font-size: 11px;
                           font-weight: 800; padding: 3px 11px; border-radius: 999px;
                           white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }

    /* ── Dimension badges (learning) — kept, restyled to tokens ── */
    .dim-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px;
                 font-weight: 600; white-space: nowrap; border: 1px solid var(--border-strong); }
    .dim-thumbnail { background: var(--info-bg);     color: var(--info);   border-color: color-mix(in srgb, var(--info) 40%, transparent); }
    .dim-title     { background: rgba(188,140,255,.12); color: #c9a6ff;    border-color: rgba(188,140,255,.4); }
    .dim-hook      { background: var(--good-bg);     color: var(--good);   border-color: color-mix(in srgb, var(--good) 40%, transparent); }
    .dim-pacing    { background: var(--warn-bg);     color: var(--warn);   border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
    .dim-retention { background: var(--critical-bg); color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
    .dim-cta       { background: var(--good-bg);     color: var(--good);   border-color: color-mix(in srgb, var(--good) 40%, transparent); }
    .dim-audio     { background: rgba(188,140,255,.12); color: #c9a6ff;    border-color: rgba(188,140,255,.4); }
    .dim-topic     { background: var(--accent-bg);   color: var(--accent); border-color: var(--accent-line); }
    .dim-default   { background: var(--overlay); color: var(--muted); border-color: var(--border); }

    /* ── Signal strength ── */
    .signal-pos { color: var(--good); font-family: var(--font-mono); font-weight: 600; }
    .signal-neg { color: var(--critical); font-family: var(--font-mono); font-weight: 600; }

    /* ── Status dots ── */
    .perf-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                vertical-align: middle; flex-shrink: 0; margin-right: 5px; }
    .perf-dot-ok   { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
    .perf-dot-warn { background: var(--warn); }
    .perf-dot-err  { background: var(--critical); box-shadow: 0 0 0 3px var(--critical-bg); }
    .perf-dot-muted { background: var(--faint); }

    /* ── Collapsible ── */
    details { margin-bottom: var(--gap); }
    details > summary { background: var(--surface); border: 1px solid var(--border);
                        border-radius: var(--radius); padding: 11px 15px; cursor: pointer;
                        list-style: none; user-select: none; font-size: 11px; font-weight: 700;
                        text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
                        display: flex; align-items: center; gap: 9px; transition: all var(--dur) var(--ease); }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: '▶'; font-size: 8px; flex-shrink: 0;
                                 display: inline-block; transition: transform var(--dur) var(--ease); color: var(--accent); }
    details[open] > summary { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
    details[open] > summary::before { transform: rotate(90deg); }
    details > summary:hover { color: var(--text); border-color: var(--accent-line); }
    .collapse-body { background: var(--surface); border: 1px solid var(--border);
                     border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 4px 18px 12px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border);
         color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
         font-weight: 700; white-space: nowrap; background: var(--bg-2); }
    td { padding: 9px 12px; border-bottom: 1px solid var(--hairline); vertical-align: middle;
         font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background var(--dur) var(--ease); }
    tbody tr:hover td { background: rgba(240,168,56,.05); }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
             font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
             white-space: nowrap; border: 1px solid var(--border-strong); }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge-complete, .badge-completed, .badge-approved, .badge-resolved, .badge-consumed,
    .badge-succeeded, .badge-auto_resolved
                    { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
    .badge-failed, .badge-rejected, .badge-blocked
                    { background: var(--critical-bg); color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
    .badge-running, .badge-pending, .badge-active, .badge-open, .badge-claimed, .badge-publishing
                    { background: var(--info-bg); color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
    .badge-queued, .badge-paused, .badge-awaiting_review, .badge-awaiting_publish_approval,
    .badge-qa_warning, .badge-needs_review, .badge-demo
                    { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
    .badge-partial, .badge-skipped, .badge-unknown, .badge-expired, .badge-cancelled, .badge-disabled
                    { background: var(--overlay); color: var(--muted); border-color: var(--border); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
           border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
           background: var(--raised); color: var(--text); font-size: 12.5px; font-weight: 600;
           font-family: var(--font-body); cursor: pointer; text-decoration: none; white-space: nowrap;
           transition: all var(--dur) var(--ease); }
    .btn:hover { border-color: var(--accent-line); color: var(--text); text-decoration: none;
                 transform: translateY(-1px); box-shadow: var(--shadow-1); }
    .btn:active { transform: none; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { background: #ffc061; border-color: #ffc061; color: var(--accent-ink); }
    .btn-approve { border-color: color-mix(in srgb, var(--good) 50%, var(--border)); color: var(--good); }
    .btn-approve:hover { background: var(--good-bg); }
    .btn-reject  { border-color: color-mix(in srgb, var(--critical) 50%, var(--border)); color: var(--critical); }
    .btn-reject:hover  { background: var(--critical-bg); }
    .btn-resolve { border-color: color-mix(in srgb, var(--warn) 50%, var(--border)); color: var(--warn); }
    .btn-resolve:hover { background: var(--warn-bg); }
    .btn-save    { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 50%, var(--border)); color: var(--good); }
    .btn-save:hover { background: color-mix(in srgb, var(--good) 22%, transparent); }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 4px 10px; font-size: 11.5px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn:disabled, .btn[disabled] { opacity: .45; pointer-events: none; }

    /* ── Filters ── */
    .filters { display: flex; gap: 8px; margin-bottom: var(--gap); flex-wrap: wrap; align-items: center; }
    .filter-link { padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted);
                   border: 1px solid transparent; text-decoration: none; transition: all var(--dur) var(--ease); }
    .filter-link:hover, .filter-link.active { border-color: var(--accent-line);
                                               background: var(--accent-bg); color: var(--accent); }

    /* ── Colour utilities ── */
    .ok    { color: var(--good); }
    .warn  { color: var(--warn); }
    .err   { color: var(--critical); }
    .muted { color: var(--muted); }
    .accent-text { color: var(--accent); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 22px; right: 22px; background: var(--overlay);
             border: 1px solid var(--border-strong); border-radius: var(--radius);
             padding: 12px 18px; font-size: 13px; z-index: 999; display: none;
             box-shadow: var(--shadow-pop); }
    .toast.show { display: block; animation: rise var(--dur) var(--ease); }
    .toast-ok  { border-color: color-mix(in srgb, var(--good) 50%, var(--border)); color: var(--good); }
    .toast-err { border-color: color-mix(in srgb, var(--critical) 50%, var(--border)); color: var(--critical); }

    /* ── Form fields ── */
    input[type=text], input[type=number], input[type=password], input[type=email],
    input[type=search], input[type=url], textarea, select {
      background: var(--bg-2); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
      font-family: inherit; padding: 9px 12px; width: 100%; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
                                                 box-shadow: 0 0 0 3px var(--accent-bg); }
    textarea { resize: vertical; min-height: 78px; line-height: 1.6; }
    label { display: block; font-size: 11px; color: var(--faint); text-transform: uppercase;
            letter-spacing: .07em; margin-bottom: 6px; font-weight: 600; }
    .field { margin-bottom: 16px; }
    .hint  { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

    /* ── Empty state ── */
    .empty { padding: 40px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--border-strong);
             border-radius: var(--radius); background: var(--bg-2); }
    .empty-title { font-family: var(--font-display); font-weight: 700; color: var(--text); font-size: 15px; margin-bottom: 6px; }

    /* ── Timeline ── */
    .timeline { list-style: none; }
    .tl-item { display: flex; gap: 13px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
    .tl-item:last-child { border-bottom: none; }
    .tl-icon { width: 22px; flex-shrink: 0; text-align: center; padding-top: 1px; color: var(--accent); }
    .tl-body { flex: 1; min-width: 0; }
    .tl-name { font-weight: 600; }
    .tl-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .tl-error { font-size: 12px; color: var(--critical); margin-top: 4px;
                font-family: var(--font-mono); word-break: break-all; }

    /* ── Flash banner ── */
    .flash { padding: 12px 16px; border-radius: var(--radius); margin-bottom: var(--gap); font-size: 13px; }
    .flash-ok  { background: var(--good-bg); border: 1px solid color-mix(in srgb, var(--good) 50%, var(--border)); color: var(--good); }
    .flash-err { background: var(--critical-bg); border: 1px solid color-mix(in srgb, var(--critical) 50%, var(--border)); color: var(--critical); }

    /* ── Inline SVG charts (_charts.html) ── */
    .spark { width: 132px; height: 30px; display: inline-block; vertical-align: middle; overflow: visible; }
    .spark-fill  { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: none; }
    .spark-line  { fill: none; stroke: var(--accent); stroke-width: 1.5;
                   stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .spark-dot   { fill: var(--accent); }
    .spark-good .spark-fill { fill: var(--good-bg); } .spark-good .spark-line, .spark-good .spark-dot { stroke: var(--good); fill: var(--good); }
    .spark-info .spark-fill { fill: var(--info-bg); } .spark-info .spark-line, .spark-info .spark-dot { stroke: var(--info); fill: var(--info); }

    /* areachart — full-width feature trend */
    .areachart { width: 100%; height: clamp(120px, 22vw, 180px); display: block; overflow: visible; }
    .areachart-grid { stroke: var(--hairline); stroke-width: 1; }
    .areachart-fill { stroke: none; fill: color-mix(in srgb, var(--accent) 14%, transparent); }
    .areachart-line { fill: none; stroke: var(--accent); stroke-width: 2;
                      stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .areachart-dot  { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
    .areachart-good .areachart-fill { fill: var(--good-bg); }
    .areachart-good .areachart-line, .areachart-good .areachart-dot { stroke: var(--good); }
    .areachart-good .areachart-dot { fill: var(--good); }
    .areachart-info .areachart-fill { fill: var(--info-bg); }
    .areachart-info .areachart-line, .areachart-info .areachart-dot { stroke: var(--info); }
    .areachart-info .areachart-dot { fill: var(--info); }
    :root[data-skin="presentation"] .areachart-line { filter: drop-shadow(0 0 8px var(--accent-line)); }

    .hbar { position: relative; display: inline-block; width: 100%; min-width: 60px; height: 8px;
            border-radius: 4px; vertical-align: middle; }
    .hbar-track { background: var(--overlay); }
    .hbar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: var(--accent); }
    .hbar-good { background: var(--good); } .hbar-warn { background: var(--warn); }
    .hbar-critical { background: var(--critical); } .hbar-info { background: var(--info); }

    .bullet { position: relative; display: inline-block; width: 100%; min-width: 72px; height: 10px;
              border-radius: 3px; background: var(--overlay); vertical-align: middle; overflow: hidden; }
    .bullet-zone { position: absolute; top: 0; height: 100%; background: var(--critical-bg); }
    .bullet-zone.bz-ok { background: var(--warn-bg); }
    .bullet-val { position: absolute; left: 0; top: 2px; height: 6px; border-radius: 3px; background: var(--accent); }
    .bullet-good { background: var(--good); } .bullet-warn { background: var(--warn); } .bullet-critical { background: var(--critical); }
    .bullet-mark { position: absolute; top: -1px; width: 2px; height: 12px; background: var(--text); }

    /* ── delta chip: ▲/▼ change indicator ── */
    .delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700;
             padding: 2px 7px; border-radius: 999px; line-height: 1.4; letter-spacing: .01em;
             font-variant-numeric: tabular-nums; white-space: nowrap; }
    .delta-arrow { font-size: 8px; }
    .delta-up   { color: var(--good);     background: var(--good-bg); }
    .delta-down { color: var(--critical); background: var(--critical-bg); }
    .delta-flat { color: var(--muted);    background: var(--overlay); }

    /* ── radial: donut progress ring ── */
    .radial { display: block; }
    .radial-track { fill: none; stroke: var(--overlay); stroke-width: 9; }
    .radial-arc   { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round;
                    transition: stroke-dasharray var(--dur-slow, 500ms) var(--ease); }
    .radial-val   { fill: var(--text); font-size: 24px; font-weight: 700; text-anchor: middle;
                    dominant-baseline: central; font-variant-numeric: tabular-nums; }
    .radial-lbl   { fill: var(--muted); font-size: 9px; text-anchor: middle; text-transform: uppercase; letter-spacing: .06em; }
    .radial-good .radial-arc { stroke: var(--good); }
    .radial-warn .radial-arc { stroke: var(--warn); }
    .radial-critical .radial-arc { stroke: var(--critical); }
    :root[data-skin="presentation"] .radial-arc { filter: drop-shadow(0 0 6px var(--accent-line)); }

    /* ── New shared primitives (opt-in; used by the wizard + refreshed pages) ── */
    .container { max-width: 1440px; margin: 0 auto; }
    .grid { display: grid; gap: var(--gap); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    @media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    .stack > * + * { margin-top: var(--gap); }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .eyebrow { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
               text-transform: uppercase; letter-spacing: .16em; color: var(--accent); }
    .lede { font-size: 14.5px; color: var(--muted); line-height: 1.65; max-width: 62ch; }
    .divider { height: 1px; background: var(--border); margin: var(--gap) 0; }

    /* readiness list item (Phase 3) */
    .rd-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
    .rd-item:last-child { border-bottom: none; }
    .rd-mark { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
               font-size: 11px; font-weight: 800; }
    .rd-ok       { background: var(--good-bg); color: var(--good); }
    .rd-warn     { background: var(--warn-bg); color: var(--warn); }
    .rd-blocker  { background: var(--critical-bg); color: var(--critical); }
    .rd-title { font-weight: 600; font-size: 13.5px; }
    .rd-detail { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

    /* stepper (wizard) */
    .stepper { display: flex; align-items: center; gap: 0; margin-bottom: 24px; flex-wrap: wrap; }
    .stp { display: flex; align-items: center; gap: 9px; color: var(--faint); font-size: 12px; font-weight: 600; }
    .stp .stp-n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border-strong);
                  display: grid; place-items: center; font-size: 11px; flex-shrink: 0; font-family: var(--font-mono);
                  transition: all var(--dur) var(--ease); }
    .stp-line { width: 26px; height: 1.5px; background: var(--border-strong); margin: 0 4px; flex-shrink: 0; }
    .stp.done { color: var(--muted); }
    .stp.done .stp-n { border-color: var(--good); color: var(--good); background: var(--good-bg); }
    .stp.current { color: var(--text); }
    .stp.current .stp-n { border-color: var(--accent); color: var(--accent-ink); background: var(--accent);
                          box-shadow: 0 0 0 4px var(--accent-bg); }

    /* ═══════════════════════════════════════════════════════════════════
       Product-grade shared primitives (2026-09-03)
       Hero sections · rich stat cards · intentional empty states ·
       insight cards. Used by the refreshed Learning / Analytics / Home
       pages; safe to adopt anywhere.
       ═══════════════════════════════════════════════════════════════════ */

    /* ── Hero ── the calm, confident opening of a page. */
    .hero {
      position: relative; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background:
        radial-gradient(720px 300px at 88% -60%, rgba(240,168,56,.10), transparent 70%),
        linear-gradient(180deg, var(--raised), var(--surface));
      padding: clamp(20px, 3vw, 34px);
      margin-bottom: var(--gap);
      box-shadow: var(--shadow-1);
    }
    .hero::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--accent), transparent);
      opacity: .8;
    }
    :root[data-skin="presentation"] .hero {
      background: var(--skin-hero), linear-gradient(180deg, var(--raised), var(--surface));
      box-shadow: var(--shadow-md);
    }
    .hero-top { display: flex; align-items: flex-start; gap: var(--space-lg);
                justify-content: space-between; flex-wrap: wrap; }
    .hero-headline { min-width: 0; flex: 1 1 320px; }
    .hero .eyebrow { margin-bottom: 10px; display: inline-block; }
    .hero h1 { font-size: clamp(24px, 3vw, var(--h1)); font-weight: 700;
               letter-spacing: -.02em; text-wrap: balance; line-height: 1.15; }
    .hero-lede { margin-top: 10px; font-size: 14px; color: var(--muted);
                 line-height: 1.6; max-width: 60ch; }
    .hero-aside { flex: 0 0 auto; display: flex; flex-direction: column;
                  align-items: flex-end; gap: 6px; text-align: right; }
    .hero-figure { font-family: var(--font-display); font-size: clamp(30px, 4vw, 44px);
                   font-weight: 700; line-height: 1; letter-spacing: -.03em;
                   font-variant-numeric: tabular-nums; }
    :root[data-skin="presentation"] .hero-figure { text-shadow: 0 0 30px rgba(240,168,56,.22); }
    .hero-figure-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
                       color: var(--faint); font-weight: 700; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .hero-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px;
                 font-size: 12px; color: var(--muted); }
    .hero-meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* status pill — reusable, semantic */
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px;
            border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
            border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .pill.is-good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--border)); background: var(--good-bg); }
    .pill.is-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-bg); }
    .pill.is-critical { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, var(--border)); background: var(--critical-bg); }
    .pill.is-live::before { animation: pulse 2s var(--ease) infinite; }

    /* ── Rich stat cards ── label · big value · delta · sparkline · note */
    .stat-grid { display: grid; gap: 14px; margin-bottom: var(--gap);
                 grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
    .stat-card { position: relative; overflow: hidden;
                 background: linear-gradient(180deg, var(--raised), var(--surface));
                 border: 1px solid var(--border); border-radius: var(--radius);
                 padding: 16px 18px; box-shadow: var(--shadow-1);
                 transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease); }
    .stat-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-2); transform: translateY(-2px); }
    .stat-card.is-accent { border-color: var(--accent-line); }
    .stat-lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase;
                letter-spacing: .09em; color: var(--faint); display: flex; align-items: center; gap: 6px; }
    .stat-val { font-family: var(--font-display); font-size: 28px; font-weight: 700;
                line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
