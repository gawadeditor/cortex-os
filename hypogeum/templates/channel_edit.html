<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit {{ channel.name }} — Cortex</title>
  {% include '_base_style.html' %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           font-size: 14px; line-height: 1.5; padding: var(--gap); max-width: 640px; }
    a { color: var(--blue); text-decoration: none; }
    .page-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: var(--gap); flex-wrap: wrap; }
    .page-header h1 { font-size: 20px; font-weight: 600; }
    .card { background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase;
            letter-spacing: .05em; margin-bottom: 4px; }
    input[type=text], textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 14px;
      font-family: inherit; padding: 6px 10px;
    }
    input[type=text]:focus, textarea:focus { outline: none; border-color: var(--blue); }
    textarea { min-height: 80px; resize: vertical; }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; padding: 6px 16px;
           border: 1px solid var(--border); border-radius: var(--radius);
           background: transparent; color: var(--text); font-size: 13px;
           font-family: inherit; cursor: pointer; text-decoration: none; }
    .btn-save { background: var(--good-bg); border-color: var(--good); color: var(--green); }
    .btn-save:hover { background: var(--good-bg); }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
  </style>
</head>
<body>
{% include "_nav.html" %}

<div class="container">


<div class="page-header">
  <h1>Edit Channel</h1>
  <a href="/channel/{{ channel.channel_id|e }}" class="btn">← Back</a>
</div>

<div class="card">
  <form method="POST" action="/channel/{{ channel.channel_id|e }}/edit">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ channel.name|e }}" required>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description">{{ channel.description|e }}</textarea>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-save">Save Changes</button>
      <a href="/channel/{{ channel.channel_id|e }}" class="btn">Cancel</a>
    </div>
  </form>
</div>

</div><!-- /.container -->
</body>
</html>
