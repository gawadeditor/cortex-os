<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} · Cortex</title>
  {% include '_base_style.html' %}
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .bare { width: 100%; max-width: 440px; }
    .bare-brand { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .11em; display: flex; align-items: center; gap: 9px; margin: 0 4px 20px; }
    .bare-brand::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent-line); }
    .bare .card { padding: 28px 26px; } .bare h1 { font-size: 24px; margin: 0 0 8px; } .bare p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
    .bare form { display: flex; gap: 8px; flex-wrap: wrap; } .bare .field { flex: 1; min-width: 200px; font: inherit; font-size: 14px; padding: 11px 13px;
      border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); }
    .bare .field:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
  </style>
</head>
<body>
<div class="bare">
  <div class="bare-brand">Cortex</div>
  <div class="card">{% block content %}{% endblock %}</div>
</div>
</body>
</html>
