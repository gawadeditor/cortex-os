<style>
  :root { --rail-w: 224px; }

  .rail {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--rail-w); z-index: 150;
    display: flex; flex-direction: column; gap: 3px;
    padding: 16px 12px; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--border);
  }
  :root[data-skin="presentation"] .rail { backdrop-filter: blur(16px) saturate(1.2); background: color-mix(in srgb, var(--surface) 82%, transparent); }

  .rail-brand { font-family: var(--font-display); font-weight: 800; font-size: 15px;
    text-transform: uppercase; letter-spacing: .11em; color: var(--text);
    display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; }
  .rail-brand::before { content: ""; width: 9px; height: 9px; border-radius: 2px;
    background: var(--accent); box-shadow: 0 0 10px var(--accent-line); }

  .rail-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px;
    border-radius: var(--radius-sm); color: var(--muted); font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
  .rail-item .i { color: var(--faint); flex-shrink: 0; }
  .rail-item:hover { background: var(--raised); color: var(--text); text-decoration: none; }
  .rail-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--accent-line); }
  .rail-item.active .i { color: var(--accent); }
  .rail-factory { margin-bottom: 4px; font-weight: 600; }

  .rail-group-label { font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .09em; color: var(--faint); padding: 12px 9px 5px;
    border-top: 1px solid var(--hairline); margin-top: 5px; }
  .rail-channels { display: flex; flex-direction: column; gap: 2px; }
  .rail-new { color: var(--faint); }
  .rail-new:hover { color: var(--accent); }
  .rail-tag { margin-left: auto; font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em;
    padding: 1px 5px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); flex-shrink: 0; }

  .rail-foot { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column;
    gap: 8px; align-items: stretch; }
  .rail-foot .skin-toggle { justify-content: center; }
  .rail-foot .worker-pill { margin-left: 0; justify-content: center; }

  .topbar { position: sticky; top: 0; z-index: 90;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 11px 0 10px; margin-bottom: var(--gap);
    background: var(--bg); border-bottom: 1px solid var(--border); }
  :root[data-skin="presentation"] .topbar { background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(12px); }
  .topbar-crumb { font-size: 12px; color: var(--faint); font-weight: 600; }
  .topbar-crumb a { color: var(--muted); }
  .topbar-crumb a:hover { color: var(--accent); }
  .topbar-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .topbar-tab { padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    color: var(--muted); text-decoration: none; transition: all var(--dur) var(--ease); }
  .topbar-tab:hover { background: var(--surface); color: var(--text); text-decoration: none; }
  .topbar-tab.active { background: var(--accent-bg); color: var(--accent); font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--accent-line); }

  .skin-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface);
    color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: all var(--dur) var(--ease); }
  .skin-toggle:hover { color: var(--text); border-color: var(--accent-line); }
  .skin-toggle.on { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
  .skin-toggle .i { width: .95em; height: .95em; }

  /* ≥1024px: rail is fixed, main content is inset. Below: rail becomes a
     slide-in drawer, hidden by default; a hamburger in the topbar opens it. */
  @media (min-width: 1024px) {
    body { padding-left: calc(var(--rail-w) + 26px); }
  }
  @media (max-width: 1023px) {
    .rail { transform: translateX(-100%); transition: transform var(--dur) var(--ease);
      box-shadow: var(--shadow-lg); }
    .rail.open { transform: none; }
    .topbar { padding-left: 46px; }
    #rail-toggle { display: block; position: fixed; top: 9px; left: 8px; z-index: 160;
      width: 38px; height: 34px; border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
      font-size: 15px; line-height: 1; cursor: pointer; }
  }
  #rail-toggle { display: none; }
</style>
