{% extends 'portal/_bare.html' %}
{% block content %}
<h1>Sign in</h1>
<p>Enter your email and we will send you a one-time sign-in link.</p>
<form method="post" action="/login">
  <input class="field" type="email" name="email" required autofocus placeholder="you@example.com" autocomplete="email">
  <button class="btn btn-primary" type="submit">Send link</button>
</form>
{% endblock %}
